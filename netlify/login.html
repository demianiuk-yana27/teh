<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вхід — Asteril Automation</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f2747,#173d70);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#142746;padding:20px}.box{width:min(430px,100%);background:#fff;border-radius:22px;padding:32px;box-shadow:0 24px 70px #07182f66}.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}.logo{width:54px;height:54px;border-radius:15px;background:#2f76f6;color:#fff;display:grid;place-items:center;font-size:28px}.brand h1{font-size:23px;margin:0}.brand p{margin:4px 0 0;color:#7184a2}.box h2{margin:0 0 8px;font-size:26px}.hint{color:#7184a2;margin:0 0 20px;line-height:1.5}input{width:100%;border:1px solid #ccd9e9;background:#f8fbff;border-radius:11px;padding:14px 15px;font:inherit;font-size:16px;outline:none}input:focus{border-color:#1769f6;box-shadow:0 0 0 3px #1769f61a}button{width:100%;margin-top:12px;border:0;border-radius:11px;padding:14px 18px;background:#1769f6;color:#fff;font:inherit;font-weight:800;cursor:pointer}.err{min-height:22px;margin-top:12px;color:#b9323b;font-weight:650}.roles{margin-top:22px;border-top:1px solid #e3ebf5;padding-top:17px;color:#607896;font-size:13px;line-height:1.6}</style></head><body><main class="box"><div class="brand"><div class="logo">⚡</div><div><h1>Asteril Automation</h1><p>Вхід до робочої системи</p></div></div><h2>Введіть пароль</h2><p class="hint">Система автоматично визначить ваш рівень доступу.</p><form id="f"><input id="p" type="password" autocomplete="current-password" placeholder="Пароль" autofocus><button id="b">Увійти</button><div class="err" id="e"></div></form><div class="roles">👤 Менеджер — база знань без запуску автоматизацій.<br>👑 Крутий бос — повний доступ.</div></main><script>f.onsubmit=async ev=>{ev.preventDefault();e.textContent='';b.disabled=true;b.textContent='Перевіряємо...';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Помилка входу');location.href='/'}catch(x){e.textContent=x.message;b.disabled=false;b.textContent='Увійти';p.select()}};</script></body></html>
