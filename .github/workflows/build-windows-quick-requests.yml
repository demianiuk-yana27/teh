name: Build Windows Quick Requests
on:
  workflow_dispatch:
  push:
    branches:
      - feature/netlify-frontend
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-quick-requests.yml'

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m py_compile desktop/quick_requests.py
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows executable
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TehQuickRequests quick_requests.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TehQuickRequests-Windows
          path: desktop/dist/TehQuickRequests.exe
          if-no-files-found: error
          retention-days: 30
