[build]
  command = "python build_netlify.py"
  publish = "netlify"

# Netlify serves the new UI and proxies automation calls to the existing
# Flask/Selenium service so the browser stays on one origin.
[[redirects]]
  from = "/api/*"
  to = "https://teh-an09.onrender.com/:splat"
  status = 200
  force = true
